apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentimental-analysis-app
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    path: helm/sentimental-analysis-backend
    repoURL: https://github.com/pauller13/sentimental-analysis.git
    targetRevision: helm-dev
  sources: []
  project: sentimental-analysis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - ApplyOutOfSyncOnly=true